<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cupons — Sorteio Kit Verão</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #CCC8BF;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 780px;
      background: url('/fundo.png') center top / cover no-repeat;
      z-index: 0;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to bottom, transparent, #CCC8BF);
    }

    .logo-area, .card, .footer {
      position: relative;
      z-index: 1;
    }

    .logo-area {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-area img {
      width: 100%;
      max-width: 480px;
      object-fit: contain;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 480px;
      background: #003D90;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      padding: 36px 32px 40px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      color: #FAC21E;
      text-align: center;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── Campos ── */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 6px;
    }

    label .obrigatorio {
      color: #FAC21E;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 15px;
      color: #fff;
      background: rgba(255,255,255,0.1);
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #FAC21E;
      background: rgba(255,255,255,0.15);
    }

    input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    /* ── Botão buscar ── */
    .btn-buscar {
      width: 100%;
      padding: 13px;
      background: #FAC21E;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-buscar:hover { background: #e6ad0a; }
    .btn-buscar:active { transform: scale(0.98); }

    /* ── Divisor ── */
    .divisor {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.12);
      margin: 28px 0;
    }

    /* ── Resultados ── */
    .resultados {
      display: none;
    }

    .resultados.visivel {
      display: block;
    }

    .resultados-titulo {
      font-size: 13px;
      font-weight: 700;
      color: #FAC21E;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .sem-resultado {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 20px 0;
    }

    /* ── Tabela de cupons ── */
    .tabela-cupons {
      width: 100%;
      border-collapse: collapse;
    }

    .tabela-cupons thead tr {
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .tabela-cupons th {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      text-align: left;
      padding: 0 0 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tabela-cupons td {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      vertical-align: middle;
    }

    .tabela-cupons tbody tr:last-child td {
      border-bottom: none;
    }

    .cupom-numero {
      font-weight: 700;
      color: #fff;
      font-size: 15px;
    }

    .cupom-loja {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #FAC21E;
      background: rgba(250,194,30,0.12);
      border: 1px solid rgba(250,194,30,0.3);
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .cupom-data {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      text-align: right;
    }

    /* ── Contador ── */
    .total-cupons {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-align: right;
      margin-top: 14px;
    }

    /* ── Voltar ── */
    .btn-voltar {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .btn-voltar:hover {
      color: #FAC21E;
    }

    /* ── Rodapé ── */
    .footer {
      margin-top: 32px;
      text-align: center;
      color: #003D90;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer > span { display: block; }

    @media (max-width: 520px) {
      .card { padding: 28px 20px 32px; }
    }
  </style>
  <script src="/js/config.js"></script>
</head>
<body>

  <div class="hero-bg"></div>

  <div class="logo-area">
    <img src="/selo-kit-ver1.png" alt="Selo Kit Verão Supermercados Popular">
  </div>

  <div class="card">

    <h1 class="card-title">Meus Cupons</h1>
    <p class="card-subtitle">Informe seus dados para consultar suas inscrições</p>

    <form id="formConsulta" novalidate>

      <div class="field">
        <label for="telefone">Telefone <span class="obrigatorio">*</span></label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
      </div>

      <div class="field">
        <label for="cpf">CPF <span class="obrigatorio">*</span></label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
      </div>

        <div id="msgErro" style="display:none;background:rgba(220,53,69,0.15);border:1px solid rgba(220,53,69,0.4);color:#ff8080;font-size:13px;padding:10px 14px;border-radius:8px;margin-top:12px;"></div>

      <button type="submit" class="btn-buscar" id="btnBuscar">Consultar Cupons</button>

    </form>

    <!-- Resultados -->
    <div class="resultados" id="resultados">
      <hr class="divisor">
      <p class="resultados-titulo">CUPONS CADASTRADOS</p>

      <div id="semResultado" class="sem-resultado" style="display:none;">
        Nenhum cupom encontrado para os dados informados.
      </div>

      <table class="tabela-cupons" id="tabelaCupons" style="display:none;">
        <thead>
          <tr>
            <th>Cupom</th>
            <th style="text-align:right">Data</th>
          </tr>
        </thead>
        <tbody id="listaCupons"></tbody>
      </table>

      <p class="total-cupons" id="totalCupons"></p>
    </div>

    <a href="index.html" class="btn-voltar">← Voltar ao início</a>

  </div>

  <footer class="footer">
    <span>Todos os direitos reservados a &copy; Supermercados Popular <span id="ano"></span>.</span>
    <span>Desenvolvido por Master Core Tecnologia.</span>
  </footer>

  <script>
    document.getElementById('ano').textContent = new Date().getFullYear();

    // Máscara telefone
    document.getElementById('telefone').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
      else if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
      else if (v.length > 0) v = '(' + v;
      e.target.value = v;
    });

    // Máscara CPF
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6,9) + '-' + v.slice(9);
      else if (v.length > 6) v = v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6);
      else if (v.length > 3) v = v.slice(0,3) + '.' + v.slice(3);
      e.target.value = v;
    });

    function formatarData(iso) {
      const [y, m, d] = iso.split('T')[0].split('-');
      return `${d}/${m}/${y}`;
    }

    function mostrarErro(msg) {
      const el = document.getElementById('msgErro');
      el.textContent  = msg;
      el.style.display = 'block';
    }

    function ocultarErro() {
      document.getElementById('msgErro').style.display = 'none';
    }

    function renderizarResultados(cupons) {
      const resultados = document.getElementById('resultados');
      const semResult  = document.getElementById('semResultado');
      const tabela     = document.getElementById('tabelaCupons');
      const lista      = document.getElementById('listaCupons');
      const total      = document.getElementById('totalCupons');

      resultados.classList.add('visivel');

      if (!cupons.length) {
        semResult.style.display = 'block';
        tabela.style.display    = 'none';
        total.textContent       = '';
        return;
      }

      semResult.style.display = 'none';
      tabela.style.display    = 'table';

      lista.innerHTML = cupons.map(c => `
        <tr>
          <td>
            <div class="cupom-numero">${c.numero_cupom}</div>
            <div><span class="cupom-loja">${c.loja}</span></div>
          </td>
          <td class="cupom-data">${formatarData(c.data_cupom)}</td>
        </tr>
      `).join('');

      total.textContent = `${cupons.length} cupom${cupons.length > 1 ? 's' : ''} encontrado${cupons.length > 1 ? 's' : ''}`;
    }

    document.getElementById('formConsulta').addEventListener('submit', async function(e) {
      e.preventDefault();
      ocultarErro();

      const btn      = document.getElementById('btnBuscar');
      const telefone = document.getElementById('telefone').value;
      const cpf      = document.getElementById('cpf').value;

      btn.disabled    = true;
      btn.textContent = 'Consultando...';

      try {
        const params = new URLSearchParams({ telefone, cpf });
        const resp   = await fetch(`${window.API_URL}/api/consulta?${params}`);
        const data   = await resp.json();

        if (!resp.ok) {
          mostrarErro(data.erro || 'Erro ao consultar. Tente novamente.');
        } else {
          renderizarResultados(data);
        }
      } catch {
        mostrarErro('Erro de conexão. Verifique sua internet e tente novamente.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Consultar Cupons';
      }
    });
  </script>

</body>
</html>
